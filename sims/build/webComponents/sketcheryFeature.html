<style>
  #featureContainer {
    position: fixed;
    display: flex;
    flex-direction: column;
    width: 100vw;
    height: 100vh;
    justify-content: space-between;
    align-items: center;
    background-color: #999999d4;
  }

  #feature {
    pointer-events: all;
    margin-top: 10vh;
    max-height: 80vh;
    max-width: 100vw;
  }

  #featureContainer.active ~ #images {
    pointer-events: none;
  }

  #tagContainer {
    transition: 0.4s;
    position: fixed;
    right: 24px;
    top: 0px;
    margin-top: 0px;
    text-align: right;
    height: 100vh;
    font-size: 24px;
    overflow: scroll;
  }

  #tagContainer li {
    --outlineColor: black;
    --outlineSize: 2px;
    list-style: none;
    line-height: 48px;
    color: black;
    background-color: blanchedalmond;
    border-radius: 4px;
    border: 1px solid grey;
    border-top: none;
    padding-left: 4px;
    padding-right: 4px;
    margin: 12px;
  }

  #tagHideButton {
    position: fixed;
    bottom: 0;
    right: 0;
    z-index: 1000;
    cursor: pointer;
    width: 32px;
    height: 50px;
  }

  #tagHideButton > div {
    width: 0;
    height: 0;
    border-top: 21px solid transparent;
    border-bottom: 21px solid transparent;
    border-left: 30px solid blanchedalmond;
    transition: .4s;
  }

  #tagHideButton.active > div {
    transform: rotate(180deg);
    transition: .4s;
  }

  #tagHideButton.active + #tagContainer {
    margin-right: -300px;
    transition: 0.4s;
  }

  #tagContainer span {
    cursor: pointer;
    text-decoration: underline;
  }
</style>

<div id="featureContainer">
  <img />
  <div id="tagHideButton" class="active">
    <div></div>
  </div>
  <ul id="tagContainer"></ul>
</div>
